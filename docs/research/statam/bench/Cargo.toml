[workspace]

[package]
name = "statam-bench7"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cetra-statam = { path = "../../../../crates/statam" }
cetra-column = { path = "../../../../crates/column" }
strata = { path = "../../../../../strata-src" }
arrow = { version = "59.3", features = ["ipc"] }
parquet = { version = "59.3", features = ["arrow", "zstd", "async"] }
object_store = "0.13"
bytes = "1.12"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
rand = "0.10"
serde_json = "1"
flate2 = "1"
sha2 = "0.10"
vortex = { version = "0.95.0", features = ["files", "zstd", "tokio"] }
vortex-io = "0.95.0"
arrow-array-60 = { package = "arrow-array", version = "60.1.0" }
arrow-schema-60 = { package = "arrow-schema", version = "60.1.0" }
arrow-ipc-60 = { package = "arrow-ipc", version = "60.1.0" }
arrow-cast-60 = { package = "arrow-cast", version = "60.1.0" }
lance-file = "14.0.3"
lance-io = "14.0.3"
lance-encoding = "14.0.3"
lance-core = "14.0.3"
arrow-array-58 = { package = "arrow-array", version = "58.0.0" }
arrow-schema-58 = { package = "arrow-schema", version = "58.0.0" }
arrow-ipc-58 = { package = "arrow-ipc", version = "58.0.0" }
object-store-14 = { package = "object_store", version = "0.14.2", features = ["aws"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 16
