[package]
name = "strata"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
arrow = { version = "59.2", default-features = false, features = ["ipc"] }
object_store = "0.13"
bytes = "1.12"
futures = "0.3.34"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2.0"
memchr = "2"
xorf = { version = "0.13.0", default-features = false, features = ["binary-fuse"] }

[dev-dependencies]
async-trait = "0.1.92"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
proptest = "1.12.0"
serde_json = "1"
llmobs-core = { path = "/home/sebastien/travaux/llm-observer/crates/core" }
fmt-testdata = { path = "../testdata" }
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
