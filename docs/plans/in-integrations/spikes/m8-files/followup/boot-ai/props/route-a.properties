# M8 follow-up Q2: Spring Boot 4.1.2 + Spring AI 2.0.2 + Boot's OpenTelemetry starter, all by properties.
spring.main.banner-mode=off
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${M8_BASE_URL}/v1
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${M8_BASE_URL}/v1/traces
management.otlp.tracing.headers.Authorization=Bearer sk-fake-m8
