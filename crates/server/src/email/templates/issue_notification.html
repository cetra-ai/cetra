<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ total }} new or regressed {{ noun }}: {{ source_name }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:32px;font-family:sans-serif;font-size:16px;line-height:1.5;color:#18181b;">
                <p style="margin:0 0 16px;font-weight:600;">{{ total }} new or regressed {{ noun }} in {{ source_name }}</p>
                <p style="margin:0 0 16px;">{{ project_name }}</p>
                {% if items %}<ul style="margin:0 0 16px;padding-left:20px;">
                  {% for item in items %}<li>{{ item.kind }}: <a href="{{ item.url }}">{{ item.title }}</a></li>
                  {% endfor %}</ul>{% endif %}
                {% if more > 0 %}<p style="margin:0 0 16px;">and {{ more }} more</p>{% endif %}
                <p style="margin:0;"><a href="{{ issues_url }}">View the issues</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
