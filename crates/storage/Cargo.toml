[package]
name = "cetra-storage"
description = "WAL, Parquet storage, catalog, compaction, and queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cetra-column.workspace = true
cetra-core.workspace = true
arrow = { workspace = true, features = ["ipc_compression", "json"] }
async-trait.workspace = true
bytes.workspace = true
bytesize.workspace = true
chrono.workspace = true
crc32c.workspace = true
datafusion.workspace = true
datafusion-datasource.workspace = true
futures.workspace = true
hex.workspace = true
humantime-serde.workspace = true
lz4_flex = { workspace = true }
# `fs` is already a default feature of the pin. `aws` is the S3 backend (D119).
object_store = { workspace = true, features = ["fs", "aws"] }
parquet.workspace = true
rustix = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
sqlx.workspace = true
sysinfo = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Fuzz entry points (track R M3): cargo-fuzz sets `--cfg fuzzing`.
[target.'cfg(fuzzing)'.dependencies]
arbitrary.workspace = true

[dev-dependencies]
arbitrary.workspace = true
proptest.workspace = true
flate2.workspace = true
tracing-subscriber.workspace = true
# Descriptor limits for the resource tests (track R M5, R5.7); the pin is the workspace's.
rustix = { workspace = true, features = ["process"] }
reqwest = { workspace = true }
tempfile.workspace = true
toml.workspace = true

# Benchmarks and S3 probes: built and run only when named with `--test` (just s3-chaos, the
# commands in their module docs). `just lint` names them, since `--all-targets` skips them.
# Every other integration test is in `tests/it/`, one binary.
[[test]]
name = "ingest_bench"
test = false

[[test]]
name = "trace_bench"
test = false

[[test]]
name = "s3_chaos"
test = false

[[test]]
name = "s3_probe"
test = false
