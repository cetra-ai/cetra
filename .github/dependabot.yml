version: 2
updates:
  - package-ecosystem: github-actions
    # Composite actions are only scanned in directories listed here.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    ignore:
      # Keep arrow, parquet and object_store majors aligned (AGENTS.md § Dependencies).
      # Arrow 60 renamed the map entry fields to `key`/`value`; see
      # docs/plans/maintenance/01-first-dependabot-batch.md before that upgrade.
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "object_store"
        update-types: ["version-update:semver-major"]
      # x509-cert stays on bergshamra's line (D-SA-11): 0.3 would put two versions in the graph.
      - dependency-name: "x509-cert"
        versions: [">=0.3.0"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      # No update-types: majors of this family move together (AGENTS.md).
      arrow-parquet-family:
        patterns:
          - "arrow"
          - "arrow-*"
          - "parquet"
          - "object_store"
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    # The fuzz crate (track R M3). Its shared crates come from the root lock through
    # `just fuzz-lock`; Dependabot updates only the exact libfuzzer-sys pin.
    directory: /fuzz
    allow:
      - dependency-name: "libfuzzer-sys"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /
    ignore:
      # openapi-typescript 7.13.0 declares typescript ^5.x and uses the JS compiler API,
      # which TypeScript 7 does not ship. Remove when openapi-typescript supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # OTel JS stays on the 2.12 line until OpenInference JS supports 3.0 (D-F-8).
      # otlp-transformer 0.300+ and @opentelemetry/api 1.10+ belong to the 3.x line.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/otlp-transformer"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      openapi:
        patterns:
          - "openapi-fetch"
          - "openapi-react-query"
          - "openapi-typescript"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /sdks/python
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      uv-dev:
        patterns:
          - "*"
