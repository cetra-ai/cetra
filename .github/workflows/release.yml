name: Release

# A tag v<version> on main publishes that version (D-N-5, D-N-6): archives, checksums, SBOMs and
# install.sh on a GitHub release, the multi-arch image and the chart on GHCR, and build
# provenance attestations (D-N-7), then the Python SDK on PyPI and the TypeScript SDK on npm through
# OIDC trusted publishing (D-N-37). A version with a pre-release part (v0.1.0-rc.1) makes a draft
# pre-release, only the exact image tag, a PyPI pre-release (0.1.0rc1) and the npm dist-tag
# `next`. docs/plans/n-packaging/README.md § Releasing.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - run: just release-verify "$GITHUB_REF_NAME"
      - id: version
        name: Read the version
        run: |
          set -euo pipefail
          version="$(tools/packaging/version.sh)"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: verify
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: "false"
      # Not ./.github/actions/js: a release build uses no cache.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/packaging # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - run: just dist "$TARGET"
      - run: just binary-smoke "target/$TARGET/release/cetra"
      - run: just install-smoke
      - run: just image cetra:dev
      - run: just image-smoke cetra:dev
      - run: just compose-smoke cetra:dev
      - run: just compose-smoke cetra:dev s3
      - run: just helm-check
      - run: just helm-smoke cetra:dev
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: target/${{ matrix.target }}/release/cetra
          format: spdx-json
          output-file: target/dist/cetra-${{ needs.verify.outputs.version }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/dist/cetra-*.tar.gz
            target/dist/cetra-*.spdx.json
          if-no-files-found: error
          retention-days: 7
      - run: just assert-clean

  macos:
    needs: verify
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: "false"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/packaging # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: just dist "$TARGET"
      - run: just binary-smoke "target/$TARGET/release/cetra"
      - run: just install-smoke
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: target/aarch64-apple-darwin/release/cetra
          format: spdx-json
          output-file: target/dist/cetra-${{ needs.verify.outputs.version }}-aarch64-apple-darwin.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: |
            target/dist/cetra-*.tar.gz
            target/dist/cetra-*.spdx.json
          if-no-files-found: error
          retention-days: 7
      - run: just assert-clean

  sdks:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not ./.github/actions/js: a release build uses no cache.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - run: just check-py
      - run: just check-ts
      - name: Build the SDK packages
        run: |
          set -euo pipefail
          py_version="$(tools/packaging/pep440.sh "$VERSION")"
          out="$GITHUB_WORKSPACE/target/sdk"
          (cd sdks/python && uv build --no-sources --out-dir "$out/python")
          pnpm --dir sdks/typescript run build
          pnpm --dir sdks/typescript pack --pack-destination "$out/npm"
          ls "$out/python/cetra_sdk-$py_version-py3-none-any.whl" "$out/python/cetra_sdk-$py_version.tar.gz"
          ls "$out/npm/cetra-ai-sdk-$VERSION.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-python
          path: target/sdk/python/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-npm
          path: target/sdk/npm/
          if-no-files-found: error
          retention-days: 7
      - run: just assert-clean

  publish:
    needs: [verify, linux, macos]
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - id: names
        name: Image and chart names
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "image=ghcr.io/$owner/cetra"
            echo "charts=ghcr.io/$owner/charts"
            echo "tags=$(tools/packaging/image-tags.sh "ghcr.io/$owner/cetra" "$VERSION")"
          } >> "$GITHUB_OUTPUT"
      - name: Stage the image contexts from the Linux archives
        run: |
          set -euo pipefail
          just image-context "target/dist/cetra-$VERSION-x86_64-unknown-linux-musl.tar.gz" amd64
          just image-context "target/dist/cetra-$VERSION-aarch64-unknown-linux-musl.tar.gz" arm64
      - run: just checksums target/dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: target/dist/SHA256SUMS

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - id: chart
        name: Package and push the chart
        env:
          CHARTS: ${{ steps.names.outputs.charts }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package deploy/helm/cetra --destination target/dist
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "target/dist/cetra-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/helm-push.log" | head -n1)"
          if [[ -z "$digest" ]]; then
            echo "no digest in the helm push output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.charts }}/cetra
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          just release-notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags=(--draft --prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --verify-tag \
            --title "cetra $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            target/dist/cetra-*.tar.gz \
            target/dist/cetra-*.spdx.json \
            target/dist/SHA256SUMS \
            "target/dist/cetra-$VERSION.tgz" \
            deploy/install.sh

  # The SDKs go out after the GitHub release, so a failed server build publishes no SDK version
  # (PyPI and npm versions cannot be reused). Trusted publishing: no token is stored (D-N-37).
  pypi:
    needs: [sdks, publish]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/cetra-sdk/
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true

  npm:
    needs: [verify, sdks, publish]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/@cetra-ai/sdk
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/npm
      - name: Publish to npm
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1; Node's bundled npm is used, not installed.
          npm_version="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$npm_version"; then
            echo "npm $npm_version is older than 11.5.1, which trusted publishing needs" >&2
            exit 1
          fi
          tag=latest
          if [[ "$PRERELEASE" == "true" ]]; then
            tag=next
          fi
          npm publish "$RUNNER_TEMP/npm/cetra-ai-sdk-$VERSION.tgz" --provenance --access public --tag "$tag"
