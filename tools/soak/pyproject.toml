[project]
name = "llmobs-soak-plot"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = ["matplotlib==3.11.2"]

[dependency-groups]
dev = ["ruff==0.17.3", "mypy==2.4.1"]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ANN", "S", "BLE", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["plot.py"]
