packages: []

# Minutes. D74/D117: no release younger than 7 days.
minimumReleaseAge: 10080

# @ai-sdk/otel 1.0.162 depends on @opentelemetry/api 1.9.1, and ai 5.0.285
# depends on 1.9.0. One copy has to be the global tracer.
overrides:
  "@opentelemetry/api": "1.9.0"

# Claude Code's install script only links its native binary from the platform
# package (@anthropic-ai/claude-code-<platform>) into bin/claude.exe; without it
# the CLI refuses to start. The other scripts stay off: the agents run without them.
# protobufjs comes in through Mastra (@grpc/proto-loader); its install script only warns about a version-scheme mismatch.
allowBuilds:
  "@anthropic-ai/claude-code@2.1.323": true
  "@google/genai@2.21.0": false
  "@github/keytar@7.10.6": false
  "@qwen-code/audio-capture@0.28.0": false
  "node-pty@1.0.0": false
  "protobufjs@7.6.6": false
