[package]
name = "cetra-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace: outside the main one, nightly only (D-R-7).
[workspace]

[dependencies]
# Exact pin: `just fuzz-lock` resolves it on top of the root lock, and Dependabot bumps it here.
libfuzzer-sys = "=0.4.13"
cetra-column = { path = "../crates/column" }
cetra-otel = { path = "../crates/otel" }
cetra-query = { path = "../crates/query" }
cetra-saml = { path = "../crates/saml" }
cetra-storage = { path = "../crates/storage" }

[[bin]]
name = "wal_record"
path = "fuzz_targets/wal_record.rs"
test = false
doc = false
bench = false

