apiVersion: v1
kind: Service
metadata:
  name: {{ include "cetra.fullname" . }}
  labels:
    {{- include "cetra.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cetra.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
# Governs the StatefulSet's pod identity (spec.serviceName).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cetra.fullname" . }}-headless
  labels:
    {{- include "cetra.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "cetra.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
