{{- if .Values.secret.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cetra.fullname" . }}
  labels:
    {{- include "cetra.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secret.values }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
