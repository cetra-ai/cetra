{{- if and .Values.s3.enabled (not .Values.s3.bucket) }}
{{- fail "s3.bucket is required when s3.enabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cetra.fullname" . }}
  labels:
    {{- include "cetra.labels" . | nindent 4 }}
spec:
  # Exactly one: one process locks the data directory (spec 12 § Packaging, D-N-10).
  replicas: 1
  serviceName: {{ include "cetra.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "cetra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cetra.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if .Values.metrics.enabled }}
      {{- $annotations = merge $annotations .Values.metrics.podAnnotations }}
      {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      # Service links would inject CETRA_PORT=tcp://... and friends, which the config loader
      # rejects as unknown CETRA_* keys.
      enableServiceLinks: false
      # Shutdown drains requests (20 s) and flushes memtables (30 s) (spec 12).
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cetra
          image: {{ include "cetra.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9464
              protocol: TCP
            {{- end }}
          env:
            - name: CETRA_DATA_DIR
              value: /data
            - name: CETRA_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            {{- if .Values.metrics.enabled }}
            - name: CETRA_METRICS_ADDR
              value: "0.0.0.0:9464"
            {{- end }}
            {{- if .Values.config }}
            - name: CETRA_CONFIG
              value: /etc/cetra/cetra.toml
            {{- end }}
            {{- if .Values.s3.enabled }}
            - name: CETRA_OBJECT_STORE
              value: {{ include "cetra.objectStore" . | quote }}
            {{- with .Values.s3.region }}
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.s3.endpoint }}
            - name: CETRA_STORAGE__S3__ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: CETRA_STORAGE__S3__FORCE_PATH_STYLE
              value: {{ .Values.s3.forcePathStyle | quote }}
            - name: CETRA_STORAGE__S3__ALLOW_HTTP
              value: {{ .Values.s3.allowHttp | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.secret.existingSecret .Values.secret.values }}
          envFrom:
            {{- if .Values.secret.values }}
            - secretRef:
                name: {{ include "cetra.fullname" . }}
            {{- end }}
            {{- with .Values.secret.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Opening storage replays the WAL before the ports open; allow 10 minutes.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/cetra
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or .Values.config .Values.extraVolumes }}
      volumes:
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "cetra.fullname" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cetra.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
